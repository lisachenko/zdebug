name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.6 is still in beta: setup-php installs the beta build and
          # Composer resolves z-engine 8.6.x-dev (the master branch alias).
          - { os: ubuntu-latest, php: '8.4' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: ubuntu-latest, php: '8.6' }
          # z-engine ships darwin (x64 + arm64) definitions for the 8.4, 8.5
          # and 8.6 lines (lisachenko/z-engine#58), so macOS runs the full PHP
          # matrix. macos-latest is arm64, macos-15-intel is x64.
          - { os: macos-latest, php: '8.4' }
          - { os: macos-latest, php: '8.5' }
          - { os: macos-latest, php: '8.6' }
          - { os: macos-15-intel, php: '8.4' }
          - { os: macos-15-intel, php: '8.5' }
          - { os: macos-15-intel, php: '8.6' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, opcache, sockets
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=0, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run unit + integration suite
        run: composer test

      - name: Integration suite must not silently skip
        run: composer test:integration

  static-analysis:
    name: PHPStan (level max, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check coding standards
        run: composer cs:check
